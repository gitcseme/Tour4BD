version: '3.9'

services:
  tour4bd-api:
    build: 
      context: .
      dockerfile: Presentation/API/Dockerfile
    container_name: tour4bd-api-con
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    depends_on:
      - tour4bd-db
    networks:
      - appnetwork

  tour4bd-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tour4bd-db-con
    restart: always
    ports:
      - "51433:1433"
    environment:
      SA_PASSWORD: "NP_HARD_Strong!Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - appnetwork

  redis:
    image: redis:latest
    container_name: tour4bd-redis-con
    restart: always
    ports:
      - "6379:6379"
    networks:
      - appnetwork

volumes:
  mssql_data:

networks:
  appnetwork:
    driver: bridge